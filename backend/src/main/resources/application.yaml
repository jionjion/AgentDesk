spring:
  application:
    name: agent-desk
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  mvc:
    async:
      request-timeout: 300000
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB
  # JPA 配置
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_schema: agent_desk
    show-sql: false
  # 数据库配置
  datasource:
    driver-class-name: org.postgresql.Driver

agentscope:
  agent:
    name: assistant

# Actuator 配置
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

agentdesk:
  # 数据库存储, 不再使用本地文件
  storage: postgresql
  # 技能包存储目录（用户安装的技能解压到此目录）
  skills:
    base-dir: ${AGENTDESK_SKILLS_DIR:${user.home}/.agentdesk/skills}
    marketplace:
      base-url: ${AGENTDESK_SKILLS_MARKETPLACE_URL:https://modelscope.cn}
  # 联网搜索工具配置
  tools:
    web-search:
      api-key: ${TAVILY_API_KEY:}
  # JWT 配置
  jwt:
    expiration: 604800000
  # Mem0 长期记忆服务
  mem0:
    base-url: ${MEM0_API_BASE_URL:http://localhost:18090}
    api-key: ${MEM0_API_KEY:}
  # 知识库 RAG 配置
  knowledge:
    enabled: true
    embedding-model: text-embedding-v3
    embedding-dimensions: 1024
    chunk-size: 512
    chunk-overlap: 50
    max-file-size: 52428800
    retrieve:
      default-top-k: 5
      default-score-threshold: 0.8
      max-context-tokens: 2000
  # 远程命令执行配置
  remote-exec:
    enabled: ${AGENTDESK_REMOTE_EXEC_ENABLED:true}
    command-timeout: 120000
    max-pending-commands: 10
    heartbeat-interval: 30
    heartbeat-timeout: 10
    max-result-size: 262144
    low-risk-commands: ls,cat,head,tail,find,grep,wc,pwd,echo,date,whoami,which,type,file
    allowed-origins: ${AGENTDESK_WS_ALLOWED_ORIGINS:http://localhost:*}
